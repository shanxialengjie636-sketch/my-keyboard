<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>セキュリティ暗証番号入力</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 入力画面 -->
  <div id="input-screen" class="device-panel">
    <h1 class="title">セキュリティ暗証番号入力</h1>
    
    <div class="display-box">
      <div id="pin-display" class="pin-display empty">暗証番号を入力してください</div>
      <div class="sub-text">4桁</div>
    </div>

    <div class="keypad">
      <button class="key-btn" data-val="1">1</button>
      <button class="key-btn" data-val="2">2</button>
      <button class="key-btn" data-val="3">3</button>
      
      <button class="key-btn" data-val="4">4</button>
      <button class="key-btn" data-val="5">5</button>
      <button class="key-btn" data-val="6">6</button>
      
      <button class="key-btn" data-val="7">7</button>
      <button class="key-btn" data-val="8">8</button>
      <button class="key-btn" data-val="9">9</button>
      
      <button class="key-btn text-key" id="btn-delete">削除</button>
      <button class="key-btn" data-val="0">0</button>
      <button class="key-btn text-key" id="btn-confirm">確定</button>
    </div>
  </div>

  <!-- 成功画面（初期状態は非表示） -->
  <div id="success-screen" class="device-panel hidden">
    <h1 class="title">解除成功！</h1>
    <div class="success-content">
      <div class="video-container">
        <!-- GitHub上の動画ファイル（video.mp4）を読み込むタグ -->
        <video id="success-video" src="video.mp4" controls playsinline preload="auto"></video>
      </div>
      <button id="btn-reset" class="key-btn text-key">最初に戻る</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
